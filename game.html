<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ظلّ أخي</title>
<style>
  body{font-family:Tahoma,Arial,sans-serif;background:#0f172a;color:#e5e7eb;margin:0;padding:16px;}
  .game{max-width:760px;margin:auto;background:#111827;border:1px solid #374151;border-radius:18px;padding:20px;box-shadow:0 10px 30px #0008;}
  h1{color:#fbbf24;text-align:center;margin-top:0;}
  #stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;background:#1f2937;padding:12px;border-radius:12px;margin:12px 0;font-size:14px;}
  .stat{display:flex;justify-content:space-between;gap:8px;}
  .bar{height:8px;background:#374151;border-radius:99px;overflow:hidden;margin-top:4px;}
  .bar > div{height:100%;background:#22c55e;width:0%;}
  #story{line-height:1.8;background:#0b1220;padding:14px;border-radius:12px;border-right:4px solid #fbbf24;}
  #log{font-size:13px;color:#cbd5e1;max-height:150px;overflow:auto;margin:10px 0;padding:10px;background:#0b1220;border-radius:12px;}
  #choices{display:grid;gap:8px;}
  button{font-family:inherit;font-size:15px;padding:12px;border:none;border-radius:12px;background:#2563eb;color:white;cursor:pointer;}
  button:hover{background:#1d4ed8;}
  #restart{background:#059669;margin-top:12px;width:100%;}
</style>
</head>
<body>
<div class="game">
  <h1>ظلّ أخي</h1>
  <p id="story"></p>
  <div id="stats"></div>
  <div id="log"></div>
  <div id="choices"></div>
  <button id="restart" onclick="startGame()" style="display:none">إعادة اللعب</button>
</div>

<script>
let state, logs;

function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

function startGame(){
  state={day:1,money:25,energy:100,mood:70,brother:60,school:50,charisma:2,over:false};
  logs=[];
  document.getElementById('restart').style.display='none';
  document.getElementById('story').textContent=
    "أنت يوسف، 16 عاماً، وسيم وهادئ. فقدتما والديكما، وتعيش مع أخيك سامي (9 سنوات). أمامكما 14 يوماً حتى تجدما استقراراً. كل قرار يؤثر على المال، الطاقة، حالتك النفسية، ثقة سامي، ومستواك الدراسي.";
  render();
}

function statsHTML(){
  const bar=(v,color)=>`<div class="bar"><div style="width:${clamp(v,0,100)}%;background:${color}"></div></div>`;
  return `
    <div class="stat"><span>اليوم</span><b>${state.day}/14</b></div>
    <div class="stat"><span>المال</span><b>${state.money} د</b></div>
    <div class="stat"><span>الطاقة</span><b>${state.energy}</b>${bar(state.energy,'#22c55e')}</div>
    <div class="stat"><span>المزاج</span><b>${state.mood}</b>${bar(state.mood,'#38bdf8')}</div>
    <div class="stat"><span>ثقة سامي</span><b>${state.brother}</b>${bar(state.brother,'#f59e0b')}</div>
    <div class="stat"><span>المدرسة</span><b>${state.school}</b>${bar(state.school,'#a78bfa')}</div>
  `;
}

function render(){
  document.getElementById('stats').innerHTML=statsHTML();
  document.getElementById('log').innerHTML=logs.slice(-8).map(x=>`<div>• ${x}</div>`).join('');
  const choices=document.getElementById('choices');

  if(state.over){
    choices.innerHTML='';
    document.getElementById('restart').style.display='block';
    return;
  }

  choices.innerHTML='';
  const actions=[
    ['العمل في المقهى',()=>{
      state.money+=12+state.charisma;
      state.energy-=18;
      state.mood-=3;
      return 'عملت في المقهى وحصلت على بعض المال.';
    }],
    ['الجلوس مع سامي',()=>{
      state.brother+=12;
      state.mood+=6;
      state.energy-=8;
      return 'لعبتم معاً وضحك سامي قليلاً.';
    }],
    ['الدراسة والمراجعة',()=>{
      state.school+=12;
      state.energy-=14;
      state.mood-=2;
      return 'راجعت دروسك رغم التعب.';
    }],
    ['طبخ وترتيب البيت',()=>{
      state.brother+=6;
      state.mood+=4;
      state.money-=4;
      state.energy-=10;
      return 'طبخت لسامي ورتبت البيت.';
    }],
    ['راحة ونوم مبكر',()=>{
      state.energy+=24;
      state.mood+=5;
      return 'أخذت قسطاً من الراحة.';
    }],
    ['طلب مساعدة الجيران',()=>{
      state.money+=6;
      state.mood+=3;
      state.brother+=4;
      state.energy-=5;
      return 'ساعدك الجيران ببعض الطعام والنقود.';
    }]
  ];

  actions.forEach(([label,fn])=>{
    const b=document.createElement('button');
    b.textContent=label;
    b.onclick=()=>takeAction(fn);
    choices.appendChild(b);
  });
}

function takeAction(fn){
  if(state.over) return;

  logs.push(fn());

  state.energy=clamp(state.energy,0,100);
  state.mood=clamp(state.mood,0,100);
  state.brother=clamp(state.brother,0,100);
  state.school=clamp(state.school,0,100);

  const ev=randomEvent();
  if(ev) logs.push(ev);

  state.money=Math.round(state.money);
  state.energy=clamp(state.energy,0,100);
  state.mood=clamp(state.mood,0,100);
  state.brother=clamp(state.brother,0,100);
  state.school=clamp(state.school,0,100);

  if(state.money<-10 || state.brother<=0 || state.energy<=0){
    finish('انهيار');
    return;
  }

  if(state.day>=14){
    finish('نهاية');
    return;
  }

  state.day++;
  render();
}

function randomEvent(){
  const events=[
    ()=>{
      if(state.money>=8){
        state.money-=8;
        state.brother+=5;
        return 'احتاج سامي دفتراً مدرسياً، فاشتريته له.';
      } else {
        state.brother-=8;
        state.mood-=5;
        return 'احتاج سامي دفتراً، لكن المال لم يكفِ.';
      }
    },
    ()=>{
      state.money+=10;
      state.energy-=10;
      return 'عرض عليك مدير المقهى ساعات إضافية، فقبلت.';
    },
    ()=>{
      state.school-=5;
      state.mood-=3;
      return 'اتصلت المدرسة تسأل عن غيابك، فتوترت.';
    },
    ()=>{
      state.mood-=6;
      state.brother+=3;
      return 'وجدتما رسالة قديمة من والدتك، فتذكرتماها.';
    },
    ()=>{
      state.brother+=6;
      state.energy-=8;
      state.mood+=2;
      return 'بكى سامي في الليل، فاحتويته حتى نام.';
    },
    ()=>{
      state.mood+=5;
      state.energy+=5;
      return 'أرسلت جارتكم طبقاً ساخناً، فشكرتها.';
    },
    ()=>{
      state.money-=5;
      state.mood-=2;
      return 'ارتفع ثمن الخبز قليلاً هذا الأسبوع.';
    },
    ()=>{
      state.school+=4;
      state.mood+=3;
      return 'ساعدك زميل في الواجب عبر الهاتف.';
    }
  ];

  if(Math.random()<0.75){
    return events[Math.floor(Math.random()*events.length)]();
  }
  return null;
}

function finish(reason){
  state.over=true;
  let ending='';

  if(reason==='انهيار'){
    ending='انكسرت تحت الضغط. ربما تحتاج إلى طلب مساعدة رسمية قبل أن ينهار كل شيء.';
  } else if(state.brother>=75 && state.school>=55 && state.mood>=50 && state.money>=20){
    ending='النهاية الأفضل: صمدتما معاً. سامي يثق بك، ومستواك الدراسي جيد، ووضعكما المالي مستقر نسبياً. هذه بداية جديدة.';
  } else if(state.brother>=50){
    ending='نهاية أمل: الأمور ليست مثالية، لكن سامي ما زال يشعر بالأمان معك. خطوة صغيرة كل يوم قد تكفي.';
  } else {
    ending='نهاية صعبة: نجوتما جسدياً، لكن المسافة بينكما اتسعت. ربما حان وقت طلب دعم المدرسة أو الجمعيات.';
  }

  logs.push('— انتهت اللعبة —');
  document.getElementById('story').textContent =
    ending + ' | المال: ' + state.money + '، ثقة سامي: ' + state.brother + '، المدرسة: ' + state.school;
  render();
}

startGame();
</script>
</body>
</html>
