<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ظلّ أخي: النجاة الكبرى</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --text: #e2e8f0; 
    --primary: #3b82f6; --danger: #ef4444; --success: #10b981;
    --warning: #f59e0b; --purple: #a78bfa; --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: var(--bg); color: var(--text); display: flex; justify-content: center; height: 100vh; overflow: hidden; }
  
  #game {
    width: 100%; max-width: 800px; height: 100vh; display: flex; flex-direction: column;
    background: var(--panel); border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  }
  
  /* Header & Stats */
  header { background: #0f172a; padding: 10px; border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; font-size: 13px; font-weight: bold;}
  .stat-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 10px; background: #0f172a; border-bottom: 1px solid var(--border); font-size: 11px;}
  .bar-bg { background: #334155; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 3px; }
  .bar-fill { height: 100%; transition: 0.3s; }
  
  /* Tabs */
  .tabs { display: flex; background: #1e293b; border-bottom: 1px solid var(--border); }
  .tab { flex: 1; text-align: center; padding: 12px 0; cursor: pointer; font-size: 13px; font-weight: bold; color: #94a3b8; border-bottom: 3px solid transparent; transition: 0.2s;}
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); background: #0f172a; }
  
  /* Content Area */
  #content { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
  
  /* Action Buttons */
  .action-card {
    background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    display: flex; justify-content: space-between; align-items: center; transition: 0.2s;
  }
  .action-card:hover { border-color: var(--primary); }
  .action-info h4 { font-size: 14px; margin-bottom: 4px; }
  .action-info p { font-size: 11px; color: #94a3b8; }
  .action-btn { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  .action-btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.5; }
  
  /* Log */
  #log { background: #0f172a; border-top: 1px solid var(--border); padding: 10px; height: 120px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column; gap: 5px;}
  .log-msg { padding: 6px 10px; border-radius: 6px; background: #1e293b; border-right: 3px solid var(--primary); }
  .log-msg.danger { border-color: var(--danger); background: #2a0505; color: #fca5a5; }
  .log-msg.success { border-color: var(--success); background: #052a1b; color: #6ee7b7; }
  .log-msg.warning { border-color: var(--warning); background: #2a1e05; color: #fcd34d; }

  /* Modals */
  .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:100; padding:20px; }
  .modal-content { background:var(--panel); padding:20px; border-radius:12px; border:1px solid var(--border); max-width:400px; text-align:center; }
  .modal-btn { margin-top: 15px; width: 100%; padding: 10px; background: var(--success); border:none; border-radius:8px; color:white; font-weight:bold; cursor:pointer;}
</style>
</head>
<body>

<div id="game">
  <header>
    <div>📅 اليوم <span id="ui-day">1</span> | <span id="ui-time">صباحاً</span></div>
    <div>💵 <span id="ui-money">50</span> د | 🍲 <span id="ui-food">3</span></div>
  </header>

  <div class="stat-bars">
    <div>
      <div style="display:flex; justify-content:space-between"><span>طاقة يوسف</span><span id="txt-energy">100</span></div>
      <div class="bar-bg"><div class="bar-fill" id="bar-energy" style="background:var(--success); width:100%"></div></div>
    </div>
    <div>
      <div style="display:flex; justify-content:space-between"><span>توتر يوسف</span><span id="txt-stress">0</span></div>
      <div class="bar-bg"><div class="bar-fill" id="bar-stress" style="background:var(--danger); width:0%"></div></div>
    </div>
    <div>
      <div style="display:flex; justify-content:space-between"><span>حالة سامي</span><span id="txt-sami">سعيد</span></div>
      <div class="bar-bg"><div class="bar-fill" id="bar-sami" style="background:var(--warning); width:70%"></div></div>
    </div>
    <div>
      <div style="display:flex; justify-content:space-between"><span>درجات المدرسة</span><span id="txt-study">40</span></div>
      <div class="bar-bg"><div class="bar-fill" id="bar-study" style="background:var(--purple); width:40%"></div></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('home')">🏠 الرئيسية</div>
    <div class="tab" onclick="switchTab('work')">💼 العمل</div>
    <div class="tab" onclick="switchTab('school')">🏫 المدرسة</div>
    <div class="tab" onclick="switchTab('shop')">🛒 المتجر</div>
    <div class="tab" onclick="switchTab('people')">👥 العلاقات</div>
  </div>

  <div id="content">
    <!-- Content changes based on tab -->
  </div>

  <div id="log">
    <div class="log-msg">مرحباً بك يا يوسف. والدك رحل وترك لك أمانة اسمها "سامي". اعمل بجد، لا تفقد أعصابك، وابقَ قوياً.</div>
  </div>
</div>

<div class="modal" id="eventModal">
  <div class="modal-content">
    <h2 id="modal-title" style="color:var(--warning); margin-bottom:10px;">حدث مفاجئ!</h2>
    <p id="modal-text" style="margin-bottom:15px; line-height:1.6;"></p>
    <div id="modal-buttons"></div>
  </div>
</div>

<script>
// ================= GAME STATE =================
let state = {
  day: 1, timeIndex: 0, times: ["صباحاً", "ظهراً", "مساءً", "ليلاً"],
  money: 50, food: 3, rentDue: 7,
  energy: 100, stress: 0, samiHappy: 70, study: 40,
  // Jobs
  jobCafe: 0, jobDelivery: 0, // Levels
  // Relationships
  npcNeighbor: 0, npcTeacher: 0, npcLandlord: 0,
  // Flags
  hasBooks: false, samiSick: false, gameOver: false, activeTab: 'home'
};

const A = { // Actions config
  work_cafe: { name: "نادل في المقهى", desc: "أجر بسيط، جهد متوسط.", cost: {energy: 20, stress: 5, time: 1}, gain: {money: 15, jobCafe: 1} },
  work_delivery: { name: "توصيل الطلبات", desc: "أجر جيد، لكنه متعب جداً.", cost: {energy: 35, stress: 15, time: 1}, gain: {money: 25, jobDelivery: 1} },
  study: { name: "الدراسة والمراجعة", desc: "تحسين درجاتك.", cost: {energy: 15, stress: 10, time: 1}, gain: {study: 10} },
  play_sami: { name: "اللعب مع سامي", desc: "يرفع معنوياته ويقلل توترك.", cost: {energy: 10, time: 1}, gain: {samiHappy: 15, stress: -10} },
  cook: { name: "طبخ وجبة", desc: "يحتاج طعاماً.", cost: {food: 1, time: 1}, gain: {samiHappy: 10, energy: 10, stress: -5} },
  sleep: { name: "النوم", desc: "استعادة الطاقة وتقليل التوتر.", cost: {time: 1}, gain: {energy: 30, stress: -20} }
};

// ================= CORE FUNCTIONS =================
function switchTab(tab) {
  state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => { if(t.innerText.includes(tab === 'home' ? 'الرئيسية' : tab === 'work' ? 'العمل' : tab === 'school' ? 'المدرسة' : tab === 'shop' ? 'المتجر' : 'العلاقات')) t.classList.add('active'); });
  renderContent();
}

function log(msg, type = '') {
  const logDiv = document.getElementById('log');
  const div = document.createElement('div');
  div.className = `log-msg ${type}`;
  div.innerText = msg;
  logDiv.appendChild(div);
  logDiv.scrollTop = logDiv.scrollHeight;
}

function updateUI() {
  document.getElementById('ui-day').innerText = state.day;
  document.getElementById('ui-time').innerText = state.times[state.timeIndex];
  document.getElementById('ui-money').innerText = state.money;
  document.getElementById('ui-food').innerText = state.food;
  
  document.getElementById('txt-energy').innerText = state.energy;
  document.getElementById('bar-energy').style.width = `${state.energy}%`;
  document.getElementById('txt-stress').innerText = state.stress;
  document.getElementById('bar-stress').style.width = `${state.stress}%`;
  document.getElementById('bar-sami').style.width = `${state.samiHappy}%`;
  document.getElementById('txt-study').innerText = state.study;
  document.getElementById('bar-study').style.width = `${state.study}%`;
  
  if(state.samiSick) document.getElementById('txt-sami').innerText = "مريض! 🤒";
  else if(state.samiHappy > 70) document.getElementById('txt-sami').innerText = "سعيد 😊";
  else if(state.samiHappy > 30) document.getElementById('txt-sami').innerText = "بخير 😐";
  else document.getElementById('txt-sami').innerText = "حزين 😢";

  renderContent();
  saveGame();
}

function performAction(key) {
  if(state.gameOver) return;
  const act = A[key];
  if(act.cost.energy && state.energy < act.cost.energy) return log("لا تملك طاقة كافية!", "danger");
  if(act.cost.food && state.food < act.cost.food) return log("لا يوجد طعام!", "danger");
  if(act.cost.time && state.timeIndex + act.cost.time > 3) return log("لا يوجد وقت كافٍ في اليوم لهذا الإجراء!", "danger");

  // Pay costs
  if(act.cost.energy) state.energy -= act.cost.energy;
  if(act.cost.stress) state.stress += act.cost.stress;
  if(act.cost.food) state.food -= act.cost.food;

  // Apply gains
  if(act.gain.money) state.money += act.gain.money;
  if(act.gain.samiHappy) state.samiHappy = Math.min(100, state.samiHappy + act.gain.samiHappy);
  if(act.gain.stress) state.stress = Math.max(0, state.stress + act.gain.stress);
  if(act.gain.energy) state.energy = Math.min(100, state.energy + act.gain.energy);
  if(act.gain.study) state.study = Math.min(100, state.study + act.gain.study);

  log(`قمت بـ: ${act.name}.`);
  
  // Advance time
  state.timeIndex += act.cost.time;
  if(state.timeIndex > 3) endDay();
  
  clampStats();
  updateUI();
}

function endDay() {
  state.timeIndex = 0;
  state.day++;
  state.rentDue--;

  // Daily consume
  if(state.food > 0) {
    state.food--;
  } else {
    state.samiHappy -= 25; state.energy -= 20; state.stress += 15;
    log("نمتما جائعين. سامي يبكي من الجوع.", "danger");
  }

  if(state.samiSick) {
    state.samiHappy -= 15; state.energy -= 10;
    log("سامي يزداد مرضاً. تحتاج لشراء دواء.", "danger");
  }

  // Rent Check
  if(state.rentDue <= 0) {
    if(state.money >= 100) {
      showEvent("المالك أبو خالد", "اليوم موعد الإيجار. أبو خالد يطرق الباب. هل تدفع 100 دينار؟", [
        { text: "دفع الإيجار (100 د)", action: () => { state.money -= 100; state.rentDue = 7; state.npcLandlord += 20; log("دفعت الإيجار. أبو خالد رحل بسلام.", "success"); } },
        { text: "مراوغة وتأجيل", action: () => { state.rentDue = 1; state.npcLandlord -= 30; state.stress += 30; log("غضب أبو خالد وهددك بالطرد.", "danger"); } }
      ]);
    } else {
      state.stress += 40; state.npcLandlord -= 50;
      log("أبو خالد يطالب بالإيجار وأنت لا تملك المال! أنتم معرضون للطرد.", "danger");
    }
  }

  // Random Events
  if(Math.random() > 0.4) triggerRandomEvent();

  clampStats();
  checkGameOver();
}

function triggerRandomEvent() {
  const events = [
    () => { state.money += 10; log("وجدت 10 دنانير في جيب سترة قديمة!", "success"); },
    () => { state.samiHappy -= 15; state.study -= 5; log("زياد زميلك في المدرسة سخر منك اليوم، زاد توترك.", "danger"); },
    () => { state.energy -= 15; log("الثلاجة تعطلت، بقيت تصليحها حتى وقت متأخر.", "warning"); },
    () => { if(state.npcNeighbor > 30) { state.food += 2; log("أم أحمد أرسلت لكما طبقاً ساخناً. جارة طيبة!", "success"); } },
    () => { if(Math.random() > 0.6) { state.samiSick = true; log("استيقظ سامي وهو يعاني من حمى شديدة!", "danger"); } }
  ];
  events[Math.floor(Math.random() * events.length)]();
}

function showEvent(title, text, buttons) {
  document.getElementById('modal-title').innerText = title;
  document.getElementById('modal-text').innerText = text;
  const btnContainer = document.getElementById('modal-buttons');
  btnContainer.innerHTML = '';
  buttons.forEach(btn => {
    const b = document.createElement('button');
    b.className = 'modal-btn';
    b.innerText = btn.text;
    b.onclick = () => {
      document.getElementById('eventModal').style.display = 'none';
      btn.action();
      updateUI();
      checkGameOver();
    };
    btnContainer.appendChild(b);
  });
  document.getElementById('eventModal').style.display = 'flex';
}

function clampStats() {
  state.energy = Math.max(0, Math.min(100, state.energy));
  state.stress = Math.max(0, Math.min(100, state.stress));
  state.samiHappy = Math.max(0, Math.min(100, state.samiHappy));
  state.study = Math.max(0, Math.min(100, state.study));
}

function checkGameOver() {
  if(state.gameOver) return;
  if(state.energy <= 0) return gameOver("الانهيار الجسدي", "لم تعد قادراً على الحركة. أخذت الخدمة الاجتماعية سامي. النهاية.");
  if(state.stress >= 100) return gameOver("الانهيار النفسي", "ضغط الحياة قتلك نفسياً. لم تستطع رعاية أخيك. النهاية.");
  if(state.samiHappy <= 0) return gameOver("سامي يهرب", "لم يتحمل سامي الجوع والحزن، فهرب. لم تجده. النهاية.");
  if(state.rentDue <= -2) return gameOver("الطرد", "طردكم المالك. أنتما الآن في الشارع. النهاية.");
  
  if(state.day > 30) {
    if(state.study > 70 && state.samiHappy > 70 && state.money > 100) gameOver("نهاية عظيمة", "نجحت! تفوقت في دراستك، واعتنيت بسامي، وحصلت على منحة دراسية. أنت بطل.");
    else gameOver("نهاية واقعية", "نجوت أنت وسامي، لكن الطريق ما زال طويلاً.");
  }
}

function gameOver(title, msg) {
  state.gameOver = true;
  showEvent(title, msg, [{text: "العب مجدداً", action: resetGame}]);
}

function resetGame() {
  localStorage.removeItem('zillSavePro');
  location.reload();
}

function saveGame() { localStorage.setItem('zillSavePro', JSON.stringify(state)); }
function loadGame() {
  const saved = localStorage.getItem('zillSavePro');
  if(saved) state = JSON.parse(saved);
}

// ================= RENDER CONTENT (TABS) =================
function renderContent() {
  const div = document.getElementById('content');
  div.innerHTML = '';

  const addCard = (title, desc, btnText, actionKey, disabled=false) => {
    div.innerHTML += `
      <div class="action-card">
        <div class="action-info">
          <h4>${title}</h4>
          <p>${desc}</p>
        </div>
        <button class="action-btn" onclick="performAction('${actionKey}')" ${disabled?'disabled':''}>${btnText}</button>
      </div>
    `;
  };

  if(state.activeTab === 'home') {
    div.innerHTML = `<h3>الرئيسية</h3><br>`;
    addCard("اللعب مع سامي", "يرفع من معنوياته ويقلل توترك.", "العب", "play_sami");
    addCard("طبخ وجبة", "يحتاج طعاماً. يجعلكما تشعران بالدفء.", "اطبخ", "cook");
    addCard("النوم والراحة", "تستعيد طاقتك وتريح أعصابك.", "نم", "sleep");
    
    if(state.samiSick) {
      div.innerHTML += `<div style="color:red; margin-top:10px; font-weight:bold;">سامي مريض! اذهب للمتجر واشترِ دواءً.</div>`;
    }
  }

  else if(state.activeTab === 'work') {
    div.innerHTML = `<h3>العمل (الخبرة: مقهى ${state.jobCafe} | توصيل ${state.jobDelivery})</h3><br>`;
    addCard("نادل في المقهى", "أجر: 15 د | طاقة: -20 | توتر: +5", "اعمل", "work_cafe");
    addCard("توصيل الطلبات", "أجر: 25 د | طاقة: -35 | توتر: +15", "اعمل", "work_delivery");
    
    if(state.jobDelivery >= 5 && state.study > 50) {
      addCard("عمل حر (أونلاين)", "أجر: 40 د | طاقة: -15 | يتطلب دراسة عالية", "اعمل", "freelance");
      // Freelance logic handled dynamically if needed, omitted for brevity in this version to keep code stable.
    }
  }

  else if(state.activeTab === 'school') {
    div.innerHTML = `<h3>المدرسة (معدلك: ${state.study}%)</h3><br>`;
    addCard("الدراسة", "يرفع معدلك الدراسي. يتطلب طاقة.", "ادرس", "study");
    if(state.study < 30) {
      div.innerHTML += `<p style="color:red; margin-top:10px; font-size:12px;">تحذير: مستواك منخفض جداً، قد ترسب!</p>`;
    }
  }

  else if(state.activeTab === 'shop') {
    div.innerHTML = `<h3>المتجر</h3><br>`;
    addCard("شراء طعام", "وجبتان. السعر: 15 دينار.", "اشترِ", "buy_food");
    addCard("شراء دواء لسامي", "يعالج مرض سامي فوراً. السعر: 25 دينار.", "اشترِ", "buy_med");
    if(state.money < 15) div.innerHTML += `<p style="color:red; font-size:12px;">لا تملك مالاً كافياً!</p>`;
  }

  else if(state.activeTab === 'people') {
    div.innerHTML = `<h3>العلاقات</h3><br>`;
    div.innerHTML += `
      <div class="action-card"><div class="action-info"><h4>أم أحمد (الجارة)</h4><p>العلاقة: ${state.npcNeighbor}%<br>قد تساعدك بالطعام إذا كانت علاقتكما جيدة.</p></div></div>
      <div class="action-card"><div class="action-info"><h4>أبو خالد (المالك)</h4><p>العلاقة: ${state.npcLandlord}%<br>لا تغضبه، الإيجار سيأتي قريباً.</p></div></div>
      <div class="action-card"><div class="action-info"><h4>الآنسة سلمى (معلمة سامي)</h4><p>العلاقة: ${state.npcTeacher}%</p></div></div>
    `;
  }
}

// Add Custom Shop Logic
const originalPerformAction = performAction;
performAction = function(key) {
  if(key === 'buy_food') {
    if(state.money >= 15) { state.money -= 15; state.food += 2; log("اشتريت طعاماً.", "success"); updateUI(); }
    else log("لا تملك مالاً!", "danger");
    return;
  }
  if(key === 'buy_med') {
    if(state.money >= 25) { 
      state.money -= 25; 
      if(state.samiSick) { state.samiSick = false; log("أعطيت سامي الدواء وتعافى!", "success"); }
      else log("اشتريت دواءً احتياطياً.");
      updateUI(); 
    } else log("لا تملك مالاً!", "danger");
    return;
  }
  originalPerformAction(key);
};

// Init
loadGame();
updateUI();
</script>
</body>
</html>
